<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title desc">
<title id="title">AXE — More intent. Less ceremony.</title>
<desc id="desc">A vivid midnight-green banner with Axe branding, a syntax chain, and the expanded tree.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111E29"/><stop offset=".56" stop-color="#10242B"/><stop offset="1" stop-color="#0B101D"/></linearGradient>
  <linearGradient id="lime" x1="0" x2="1"><stop stop-color="#E9FF8D"/><stop offset="1" stop-color="#63E3C3"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#51D9A0" stop-opacity=".25"/><stop offset="1" stop-color="#51D9A0" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7BB5BA" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="22" flood-color="#000000" flood-opacity=".38"/></filter>
</defs>
<rect width="1440" height="590" rx="28" fill="url(#bg)"/>
<rect width="1440" height="590" rx="28" fill="url(#grid)"/>
<ellipse cx="1180" cy="100" rx="540" ry="350" fill="url(#halo)"/>
<g transform="translate(74 77)">
  <path d="M0 24H16V-5H37V24H59V45H37V87H16V45H0Z" fill="#C7F27F" opacity=".9"/>
  <path d="M13 27 47 61" stroke="#10242B" stroke-width="8" stroke-linecap="round"/>
  <text x="4" y="207" fill="url(#lime)" font-family="Inter,Arial,sans-serif" font-size="132" font-weight="900" letter-spacing="-9">AXE</text>
  <text x="9" y="260" fill="#E9F5EF" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">More intent.</text>
  <text x="9" y="303" fill="#E9F5EF" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">Less ceremony.</text>
  <text x="9" y="366" fill="#8CA8B0" font-family="Inter,Arial,sans-serif" font-size="21">A compact view-declaration language</text>
  <text x="9" y="398" fill="#8CA8B0" font-family="Inter,Arial,sans-serif" font-size="21">designed for human-readable density.</text>
</g>
<g transform="translate(645 68)" filter="url(#shadow)">
  <rect width="728" height="446" rx="22" fill="#101821" stroke="#35515B" stroke-width="2"/>
  <rect width="728" height="66" rx="22" fill="#182A34"/>
  <path d="M0 66H728" stroke="#35515B"/>
  <circle cx="30" cy="33" r="7" fill="#F67579"/><circle cx="53" cy="33" r="7" fill="#F4C46B"/><circle cx="76" cy="33" r="7" fill="#81D6A3"/>
  <text x="115" y="42" fill="#B3D4D4" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600">view.axe</text>
  <text x="34" y="115" fill="#78D5BE" font-family="ui-monospace,Consolas,monospace" font-size="20">01</text>
  <text x="88" y="115" fill="#91AEB5" font-family="ui-monospace,Consolas,monospace" font-size="20">// One line. An entire ancestry.</text>
  <rect x="28" y="138" width="671" height="102" rx="14" fill="#20343A" stroke="#6DBDA5" stroke-opacity=".38"/>
  <text x="55" y="201" fill="#E9FF9F" font-family="ui-monospace,Consolas,monospace" font-size="24" font-weight="700">&lt;B(w=+ h=+)/V/T&gt;Hello!&lt;/B/V/T&gt;</text>
  <text x="55" y="278" fill="#9DB4BE" font-family="Inter,Arial,sans-serif" font-size="19">Expands to the exact same view tree</text>
  <path d="M92 308V394M92 326H159M92 362H159M92 394H159" stroke="#54747D" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <rect x="158" y="305" width="135" height="42" rx="9" fill="#273E45"/>
  <rect x="158" y="349" width="135" height="42" rx="9" fill="#273E45"/>
  <rect x="158" y="393" width="242" height="42" rx="9" fill="#294E45"/>
  <text x="173" y="333" fill="#C8DCDD" font-size="19" font-family="ui-monospace,Consolas,monospace">Box</text>
  <text x="173" y="377" fill="#C8DCDD" font-size="19" font-family="ui-monospace,Consolas,monospace">VBox</text>
  <text x="173" y="421" fill="#C9FF94" font-size="19" font-family="ui-monospace,Consolas,monospace">Text: Hello!</text>
  <rect x="480" y="320" width="207" height="82" rx="13" fill="#183B36" stroke="#7AD0AC" stroke-opacity=".48"/>
  <text x="502" y="354" fill="#BFEFCE" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">COMPILE TIME</text>
  <text x="502" y="381" fill="#8FC8B6" font-family="Inter,Arial,sans-serif" font-size="16">No runtime wrapper</text>
</g>
<text x="82" y="555" fill="#86B3B0" font-size="16" font-family="Inter,Arial,sans-serif">COMPONENT INDEX  /  PROP INDEX  /  VALUE INDEX  /  CHAINED NESTING  /  REUSE</text>
</svg>