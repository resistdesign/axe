<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">Axe syntax is a composable vocabulary</title>
<desc id="desc">Three static indexes independently expand components, prop names, and values. Chaining and parent reuse shape the same tree.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F8F7"/><stop offset="1" stop-color="#E3F0E8"/></linearGradient>
  <linearGradient id="blk" x1="0" x2="1"><stop stop-color="#13252F"/><stop offset="1" stop-color="#1C3D3B"/></linearGradient>
  <filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#44665E" flood-opacity=".12"/></filter>
</defs>
<rect width="1440" height="850" rx="22" fill="url(#bg)"/>
<text x="58" y="77" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" fill="#153039">Three indexes. One readable language.</text>
<text x="58" y="115" font-family="Inter,Arial,sans-serif" font-size="22" fill="#566E74">Every index expands independently. Write w+ (or w=+ to clarify).</text>
<g filter="url(#s)">
<rect x="56" y="156" width="416" height="266" rx="21" fill="#FFF" stroke="#C8D9D2"/>
<rect x="512" y="156" width="416" height="266" rx="21" fill="#FFF" stroke="#C8D9D2"/>
<rect x="968" y="156" width="416" height="266" rx="21" fill="#FFF" stroke="#C8D9D2"/>
</g>
<text x="87" y="207" font-size="24" font-weight="750" fill="#173E40" font-family="Inter,Arial,sans-serif">01  ComponentIndex</text>
<text x="544" y="207" font-size="24" font-weight="750" fill="#173E40" font-family="Inter,Arial,sans-serif">02  PropIndex</text>
<text x="998" y="207" font-size="24" font-weight="750" fill="#173E40" font-family="Inter,Arial,sans-serif">03  ValueIndex</text>
<rect x="87" y="237" width="94" height="100" rx="15" fill="#D8F7CB"/>
<rect x="544" y="237" width="94" height="100" rx="15" fill="#D8F7CB"/>
<rect x="998" y="237" width="94" height="100" rx="15" fill="#D8F7CB"/>
<text x="119" y="306" font-size="53" font-weight="800" fill="#0D4B39" font-family="ui-monospace,Consolas,monospace">B</text>
<text x="575" y="306" font-size="53" font-weight="800" fill="#0D4B39" font-family="ui-monospace,Consolas,monospace">w</text>
<text x="1025" y="306" font-size="53" font-weight="800" fill="#0D4B39" font-family="ui-monospace,Consolas,monospace">+</text>
<path d="M202 286H256M654 286H709M1112 286H1164" stroke="#2F7366" stroke-width="4"/><path d="m244 276 13 10-13 10m453-20 13 10-13 10m454-20 13 10-13 10" stroke="#2F7366" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="271" y="298" font-size="34" font-weight="700" fill="#19464A" font-family="ui-monospace,Consolas,monospace">Box</text>
<text x="723" y="298" font-size="29" font-weight="700" fill="#19464A" font-family="ui-monospace,Consolas,monospace">width</text>
<text x="1180" y="298" font-size="28" font-weight="700" fill="#19464A" font-family="ui-monospace,Consolas,monospace">100%</text>
<text x="87" y="380" font-size="18" fill="#62777A" font-family="Inter,Arial,sans-serif">What to create</text>
<text x="544" y="380" font-size="18" fill="#62777A" font-family="Inter,Arial,sans-serif">What to configure</text>
<text x="998" y="380" font-size="18" fill="#62777A" font-family="Inter,Arial,sans-serif">Which common value</text>
<path d="M264 432V479M720 432V479M1176 432V479M264 479H1176M720 479V505" stroke="#89B9A8" stroke-width="4" fill="none"/>
<rect x="154" y="508" width="1132" height="109" rx="18" fill="url(#blk)"/>
<text x="189" y="546" font-size="18" font-weight="700" fill="#9ED5C7" font-family="Inter,Arial,sans-serif">YOU AUTHOR</text>
<text x="189" y="591" font-size="30" font-weight="750" fill="#E4FFAC" font-family="ui-monospace,Consolas,monospace">&lt;B w+ /&gt;</text>
<path d="M578 567H657" stroke="#65BB9B" stroke-width="4"/><path d="m643 557 15 10-15 10" stroke="#65BB9B" stroke-width="4" fill="none"/>
<text x="692" y="546" font-size="18" font-weight="700" fill="#9ED5C7" font-family="Inter,Arial,sans-serif">COMPILER PRODUCES</text>
<text x="692" y="591" font-size="29" font-weight="750" fill="#FFFFFF" font-family="ui-monospace,Consolas,monospace">&lt;Box width="100%" /&gt;</text>
<rect x="56" y="649" width="1328" height="143" rx="18" fill="#E5EFE9" stroke="#C6DDD2"/>
<text x="88" y="696" font-size="24" font-weight="750" fill="#133B3A" font-family="Inter,Arial,sans-serif">Chained nesting</text>
<text x="88" y="733" font-size="24" fill="#1A5B53" font-family="ui-monospace,Consolas,monospace">&lt;B/V/T&gt;Hi&lt;/B/V/T&gt;</text>
<text x="88" y="766" font-size="17" fill="#607773" font-family="Inter,Arial,sans-serif">One authoring path, three real nodes</text>
<path d="M694 681V756" stroke="#B2CFC4" stroke-width="2"/>
<text x="730" y="696" font-size="24" font-weight="750" fill="#133B3A" font-family="Inter,Arial,sans-serif">Parent reuse</text>
<text x="730" y="733" font-size="24" fill="#1A5B53" font-family="ui-monospace,Consolas,monospace">&lt;^B/^V/T&gt;Hola&lt;/B/V/T&gt;</text>
<text x="730" y="766" font-size="17" fill="#607773" font-family="Inter,Arial,sans-serif">Keep ancestors, add another child (experimental)</text>
</svg>